<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImmoPilot – Hausverwaltung</title><link rel="stylesheet" href="/style.css"></head><body><div id="login" class="login-screen" hidden><form id="loginForm" class="login-card"><h1>⌂ ImmoPilot</h1><p>Private Immobilienverwaltung</p><label>Benutzername<input name="username" autocomplete="username" required></label><label>Passwort<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">Anmelden</button></form></div><div id="workspace" class="app" hidden><aside><div class="brand"><span class="brandicon">⌂</span> ImmoPilot <small>VERWALTUNG</small></div><div class="navtitle">ARBEITSPLATZ</div><nav id="nav"></nav><div class="asidefoot">Private Immobilienverwaltung<br><small>Version 2.2</small></div></aside><main><header><div><div class="crumb">Hausverwaltung / <span id="crumb">Übersicht</span></div><h1 id="heading">Dashboard</h1><p id="subtitle">Alles Wichtige zu deinen Immobilien auf einen Blick.</p></div><div class="account"><small id="account"></small><button id="logout" class="secondary">Abmelden</button></div></header><section id="content"></section></main></div><dialog id="modal"><form id="editor"><div class="modalhead"><h2 id="modalTitle">Neuer Eintrag</h2><button type="button" id="close" class="close">×</button></div><div id="fields"></div><div class="modalactions"><button type="button" id="cancel" class="secondary">Abbrechen</button><button type="submit" class="primary">Speichern</button></div></form></dialog><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
