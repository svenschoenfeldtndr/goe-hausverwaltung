services:
  - type: web
    name: immopilot-private
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: immopilot-data
      mountPath: /var/data
      sizeGB: 1
